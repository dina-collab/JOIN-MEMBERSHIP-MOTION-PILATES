<!DOCTYPE html>
<html>
<head>
  <title>Motion Pilates Membership</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: linear-gradient(to bottom, #e0f7f5, #ffffff);
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #0a7c6f;
      margin-bottom: 5px;
    }

    .brand {
      text-align: center;
      font-style: italic;
      color: #555;
      margin-bottom: 20px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #0a7c6f;
      color: white;
      border: none;
      margin-top: 15px;
      border-radius: 8px;
      font-size: 16px;
    }

    button:hover {
      background: #075e54;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- JUDUL -->
    <h2>Join Membership</h2>
    <div class="brand"><b><i>MOTION PILATES</i></b></div>

    <!-- FORM -->
    <form onsubmit="kirimWA(); return false;">

      <label>Nama Lengkap:</label><br>
      <input type="text" id="nama" required><br><br>

      <label>No HP (WhatsApp):</label><br>
      <input type="text" id="nohp" required><br><br>

      <label>Plan Membership:</label><br>
<select id="plan">
  <option value="Private Class">Private Class</option>
  <option value="Group Membership 3 Bulan">Group Membership 3 Bulan</option>
  <option value="Group Membership 6 Bulan">Group Membership 6 Bulan</option>
  <option value="Group Membership 12 Bulan">Group Membership 12 Bulan</option>
</select><br><br>

      <label>Time Available:</label><br>
      <select id="time">
        <option value="Morning">Morning</option>
        <option value="Afternoon">Afternoon</option>
        <option value="Night">Night</option>
      </select><br><br>

      <button type="submit">Daftar via WhatsApp</button>

    </form>

  </div>

  <script>
    function kirimWA() {
      var nama = document.getElementById("nama").value;
      var nohp = document.getElementById("nohp").value;
      var time = document.getElementById("time").value;
      var plan = document.getElementById("plan").value;

      var pesan = 
        "Halo Motion Pilates,%0A%0A" +
        "Saya ingin mendaftar membership dengan detail berikut:%0A%0A" +
        "Nama: " + nama + "%0A" +
        "No HP: " + nohp + "%0A" +
        "Plan: " + plan + "%0A" +
        "Waktu: " + time + "%0A%0A" +
        "Mohon info lebih lanjut ya. Terima kasih 🙏";

      var nomor = "6283164569368";
      var url = "https://wa.me/" + nomor + "?text=" + pesan;

      window.open(url, '_blank');
    }
  </script>

</body>
</html>
